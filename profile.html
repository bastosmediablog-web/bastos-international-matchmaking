 <!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Profile | Bastos Matchmaking</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">

<div class="container">

<a class="navbar-brand" href="index.html">

<span class="brand-mark">B</span>
<span>Bastos</span>
<small>Matchmaking</small>

</a>


</div>

</nav>

</header>



<main class="dashboard-page">


<div class="container">


<div class="row justify-content-center">


<div class="col-lg-7">


<div class="register-card">


<div class="text-center mb-4">

<p class="eyebrow">
My Profile
</p>

<h1 id="profileName">
Loading...
</h1>

<p>
Update your information and tell your story.
</p>

</div>



<form id="profileForm">


<div class="mb-3">

<label class="form-label">
Full Name
</label>

<input 
type="text"
id="fullName"
class="form-control">

</div>



<div class="mb-3">

<label class="form-label">
Location
</label>

<input 
type="text"
id="location"
class="form-control">

</div>



<div class="mb-3">

<label class="form-label">
Relationship Goal
</label>

<select id="goal" class="form-select">

<option>Marriage</option>
<option>Serious Relationship</option>
<option>Companionship</option>

</select>

</div>



<div class="mb-3">

<label class="form-label">
About Me
</label>

<textarea
id="about"
class="form-control"
rows="5"></textarea>

</div>



<button class="btn btn-primary-brand w-100 btn-lg">

Save Profile →

</button>


</form>


</div>


</div>


</div>


</div>


</main>



<script type="module" src="js/profile.js"></script>


</body>

</html>
