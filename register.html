<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Create Profile | Bastos Matchmaking</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">

<div class="container">

<a class="navbar-brand" href="index.html">
<span class="brand-mark">B</span>
<span>Bastos</span>
<small>Matchmaking</small>
</a>


</div>

</nav>
</header>



<section class="register-page">


<div class="container">

<div class="row justify-content-center">


<div class="col-lg-6">


<div class="register-card">


<div class="text-center mb-4">

<p class="eyebrow">
Join Our Community
</p>

<h1>Create Your Profile</h1>

<p>
Tell us about yourself and begin your matchmaking journey.
</p>

</div>



 <form id="registerForm">


<div class="mb-3">

<label class="form-label">
Full Name
</label>

 <input
type="text"
id="fullName"
class="form-control"
placeholder="Your name"
required>

</div>



<div class="mb-3">

<label class="form-label">
Email Address
</label>

 <input
type="email"
id="email"
class="form-control"
placeholder="Email"
required>

</div>



<div class="mb-3">

<label class="form-label">
Password
</label>

 <input
type="password"
id="password"
class="form-control"
placeholder="Create password"
required>

</div>



<div class="row">


<div class="col-md-6 mb-3">

<label class="form-label">
Gender
</label>

 <select
id="gender"
class="form-select"
required>

<option>Select</option>
<option>Male</option>
<option>Female</option>

</select>

</div>



<div class="col-md-6 mb-3">

<label class="form-label">
Date of Birth
</label>

 <input
type="date"
id="dob"
class="form-control"
required>

</div>


</div>



<div class="mb-3">

<label class="form-label">
Location
</label>

 <input
type="text"
id="location"
class="form-control"
placeholder="City / Country"
required>

</div>



<div class="mb-3">

<label class="form-label">
Relationship Goal
</label>

 <select
id="relationshipGoal"
class="form-select"
required>

<option>Select</option>
<option>Marriage</option>
<option>Serious Relationship</option>
<option>Companionship</option>

</select>

</div>



 <button
type="submit"
class="btn btn-primary-brand w-100 btn-lg">

Create My Profile →

</button>


</form>


</div>


</div>


</div>


</div>


</section>




<footer class="footer">

<div class="container text-center">

<p>
© 2026 Bastos Matchmaking. All rights reserved.
</p>

</div>

</footer>


<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>
</body>

</html>
