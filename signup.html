<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Bastos Matchmaking</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        Bastos Matchmaking
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="#">How It Works</a>
        <a href="#">Membership</a>
        <a href="login.html">Login</a>
    </nav>
</header>


<section class="signup-section">

    <div class="signup-box">

        <h1>Create Your Love Profile</h1>

        <p>
            Join Bastos Matchmaking and meet genuine people looking for meaningful relationships.
        </p>


        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name">


            <label>Email Address</label>
            <input type="email" placeholder="Enter your email">


            <label>Password</label>
            <input type="password" placeholder="Create password">


            <label>I am</label>
            <select>
                <option>Select</option>
                <option>Male</option>
                <option>Female</option>
            </select>


            <label>Date of Birth</label>
            <input type="date">


            <label>Location</label>
            <input type="text" placeholder="City / Country">


            <label>Looking For</label>
            <select>
                <option>Select</option>
                <option>Marriage</option>
                <option>Serious Relationship</option>
                <option>Companionship</option>
            </select>


            <button type="submit">
                Create Account
            </button>

        </form>

    </div>

</section>


<footer>

<p>
© 2026 Bastos Matchmaking. All Rights Reserved.
</p>

</footer>


</body>
</html>
