<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Members | Bastos Matchmaking</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">

<div class="container">

<a class="navbar-brand" href="dashboard.html">

<span class="brand-mark">B</span>

<span>Bastos</span>

<small>Matchmaking</small>

</a>

<div class="ms-auto d-flex gap-2">

<a href="dashboard.html" class="btn btn-outline-brand">
Dashboard
</a>

<a href="profile.html" class="btn btn-primary-brand">
My Profile
</a>

</div>

</div>

</nav>

</header>

<main class="dashboard-page">

<div class="container">

<div class="dashboard-header text-center mb-5">

<p class="eyebrow">

Discover Members

</p>

<h1>

Find Meaningful Connections

</h1>

<p>

Browse verified members looking for meaningful relationships.

</p>

</div>

<div class="row mb-4">

<div class="col-lg-4 mb-3">

<select id="genderFilter" class="form-select">

<option value="">All Genders</option>

<option value="Male">Male</option>

<option value="Female">Female</option>

</select>

</div>

<div class="col-lg-4 mb-3">

<select id="goalFilter" class="form-select">

<option value="">Relationship Goal</option>

<option value="Marriage">Marriage</option>

<option value="Serious Relationship">Serious Relationship</option>

<option value="Companionship">Companionship</option>

</select>

</div>

<div class="col-lg-4 mb-3">

<input
id="locationFilter"
type="text"
class="form-control"
placeholder="Search by location">

</div>

</div>

<div class="row mb-5">

<div class="col-12">

<button
id="searchBtn"
class="btn btn-primary-brand">

Search Members

</button>

</div>

</div>

<div
id="membersContainer"
class="row g-4">

<div class="col-12 text-center">

<div class="dashboard-card">

<h3>

Loading Members...

</h3>

<p>

Please wait while we load members.

</p>

</div>

</div>

</div>

</div>

</main>

<footer class="footer">

<div class="container text-center">

<p>

© 2026 Bastos Matchmaking. All rights reserved.

</p>

</div>

</footer>

<script type="module" src="js/members.js"></script>

</body>

</html>
