<!DOCTYPE html>
<html>
<head>
<title>Bastos International Matchmaking Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background:#fafafa;
    margin:0;
}

header {
    background:linear-gradient(135deg,#800000,#d4af37);
    color:white;
    text-align:center;
    padding:30px;
}

.container {
    max-width:600px;
    margin:25px auto;
    background:white;
    padding:25px;
    border-radius:10px;
}

input, select, textarea {
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button {
    background:#800000;
    color:white;
    padding:14px;
    width:100%;
    border:none;
    border-radius:5px;
    font-size:16px;
}

footer {
    text-align:center;
    background:#222;
    color:white;
    padding:15px;
}
</style>

</head>

<body>

<header>
<h1>❤️ BASTOS INTERNATIONAL MATCHMAKING</h1>
<p>Membership Registration Form</p>
</header>


<div class="container">

<h2>Apply For Matchmaking</h2>

<form action="https://formsubmit.co/Bastosmediablog@gmail.com" method="POST">

<input type="hidden" name="_subject" value="New Matchmaking Registration">

<input type="hidden" name="_captcha" value="false">

<input type="hidden" name="_next" value="https://bastosmediablog-web.github.io/bastos-international-matchmaking/thankyou.html">
<label>Full Name</label>
<input type="text" name="name" required>

<label>Gender</label>
<select name="gender">
<option>Male</option>
<option>Female</option>
</select>

<label>Age</label>
<input type="number" name="age" required>

<label>Country</label>
<input type="text" name="country" required>

<label>Phone / WhatsApp Number</label>
<input type="text" name="phone" required>

<label>Email Address</label>
<input type="email" name="email">

<label>Relationship Goal</label>
<select name="goal">
<option>Marriage</option>
<option>Serious Relationship</option>
<option>Friendship</option>
</select>

<label>About Yourself</label>
<textarea name="message" rows="5"></textarea>

<button type="submit">
Submit Application
</button>

</form>

</div>


<footer>
© 2026 BASTOS INTERNATIONAL MATCHMAKING
</footer>

</body>
</html>
